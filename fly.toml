# Fly.io app for the FastAPI backend. Sydney region = same city as a Supabase
# ap-southeast-2 project. Deploy from repo root:  fly deploy
# Secrets:  fly secrets set SUPABASE_DB_URL=... ANTHROPIC_API_KEY=... (see backend/.env.example)
app = "driversgigtax-api"
primary_region = "syd"

[build]
  # Installs backend/requirements.txt only (runtime). Lint and tests are requirements-dev.txt.
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # background Drive backups run in-process
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
